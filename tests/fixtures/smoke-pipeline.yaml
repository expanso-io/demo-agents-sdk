# =============================================================================
# Smoke test pipeline — same shape as a real SDK pipeline but uses the stub
# classifier in tests/fixtures/echo_classify.py. No API key required.
# Validate: expanso-cli job validate --offline tests/fixtures/smoke-pipeline.yaml
# =============================================================================
---
name: smoke
type: pipeline
config:
  input:
    file:
      paths: [/data/events.jsonl]
      codec: lines

  pipeline:
    processors:
      - subprocess:
          name: uv
          args: ["run", "-s", "/scripts/echo_classify.py"]

  output:
    stdout:
      codec: lines
