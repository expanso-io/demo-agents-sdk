# One-shot runners. Each starts the replay gateway and Expanso Edge in one
# container, deploys one pipeline, and exits once its four records appear.
# `docker compose run --rm gateway-http` works from a bare clone.
x-runner: &runner
  build: .
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:uid=1000,gid=1000,mode=0700
  environment:
    EXPECT_RECORDS: "4"
    HOME: /tmp

services:
  gateway-http:
    <<: *runner
    command: ["pipelines/gateway-http.yaml"]

  gateway-subprocess:
    <<: *runner
    command: ["pipelines/gateway-subprocess.yaml"]
