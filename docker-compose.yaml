# =============================================================================
# demo-agents-sdk — one-shot pipeline runners.
#
# Every service uses the local runner image (expanso-edge + expanso-cli + uv).
# The image's `run-demo` entrypoint starts the agent in --local mode, deploys
# the pipeline via expanso-cli, then tails the agent so pipeline output lands
# on the container's stdout.
#
# Examples:
#   docker compose run --rm openai-http
#   docker compose run --rm openai-sdk
#   docker compose down -v
# =============================================================================

x-runner: &runner
  build: .
  image: demo-agents-sdk-runner
  volumes:
    - ./pipelines:/pipelines:ro
    - ./data:/data:ro
    - ./scripts:/scripts:ro
    - uv-cache:/root/.cache/uv

services:
  openai-http:
    <<: *runner
    command: ["/pipelines/openai-http.yaml"]
    environment:
      - OPENAI_API_KEY
      - OPENAI_MODEL

  openai-sdk:
    <<: *runner
    command: ["/pipelines/openai-sdk.yaml"]
    environment:
      - OPENAI_API_KEY
      - OPENAI_MODEL

  anthropic-http:
    <<: *runner
    command: ["/pipelines/anthropic-http.yaml"]
    environment:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL

  anthropic-sdk:
    <<: *runner
    command: ["/pipelines/anthropic-sdk.yaml"]
    environment:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL

  gemini-http:
    <<: *runner
    command: ["/pipelines/gemini-http.yaml"]
    environment:
      - GEMINI_API_KEY
      - GEMINI_MODEL

  gemini-sdk:
    <<: *runner
    command: ["/pipelines/gemini-sdk.yaml"]
    environment:
      - GEMINI_API_KEY
      - GEMINI_MODEL

volumes:
  uv-cache:
