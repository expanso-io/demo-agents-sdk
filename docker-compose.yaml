# One-shot fixture-mode runners. The demo-kit is mounted read-only so the
# entrypoint can start the shared gateway inside the same container as Edge.
x-runner: &runner
  build: .
  image: demo-agents-sdk-runner
  working_dir: /workspace
  volumes:
    - ./pipelines:/pipelines:ro
    - ./data:/data:ro
    - ./scripts:/scripts:ro
    - ./:/workspace:ro
    - ../_demo-kit:/demo-kit:ro
    - gateway-state:/workspace/.runtime
    - uv-cache:/root/.cache/uv
  environment:
    - MODEL_GATEWAY_CONFIG=/workspace/model-gateway.toml

services:
  gateway-http:
    <<: *runner
    command: ["/pipelines/gateway-http.yaml"]

  gateway-subprocess:
    <<: *runner
    command: ["/pipelines/gateway-subprocess.yaml"]

volumes:
  gateway-state:
  uv-cache:
