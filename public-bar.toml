# Public example bar manifest. Checked by the shared demo-kit public-bar.py.
version = 1

[repository]
name = "demo-agents-sdk"
published = true

[web]
document = "explorer/index.html"
explanation_selector = "#explanation"
explorer_selector = "#explorer"
run_selector = "#run"
deploy_selector = "#deploy"

[browser]
url = "http://127.0.0.1:18160/explorer/"
ready_url = "http://127.0.0.1:18160/explorer/index.html"
start_command = ["python3", "-m", "http.server", "18160", "--bind", "127.0.0.1"]
stop_command = ["python3", "scripts/stop_local.py", "18160"]
json_selectors = ["#stage-input", "#stage-output"]
theme_toggle_selector = "#theme"
stage_selector = "[data-path-list]:not([hidden]) [data-stage]"
current_stage_selector = "[data-path-list]:not([hidden]) [data-stage][aria-current='step']"
scroll_anchor_selector = "#explorer"

[[browser.controls]]
id = "copy-input"
kind = "copy"
selector = "#copy-input"
feedback_selector = "#copy-input-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-output"
kind = "copy"
selector = "#copy-output"
feedback_selector = "#copy-output-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-code"
kind = "copy"
selector = "#copy-code"
feedback_selector = "#copy-code-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-run-http"
kind = "copy"
selector = "#copy-run-http"
feedback_selector = "#copy-run-http-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-run-subprocess"
kind = "copy"
selector = "#copy-run-subprocess"
feedback_selector = "#copy-run-subprocess-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-prove"
kind = "copy"
selector = "#copy-prove"
feedback_selector = "#copy-prove-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-enroll"
kind = "copy"
selector = "#copy-enroll"
feedback_selector = "#copy-enroll-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-start"
kind = "copy"
selector = "#copy-start"
feedback_selector = "#copy-start-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-deploy"
kind = "copy"
selector = "#copy-deploy"
feedback_selector = "#copy-deploy-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-nodes"
kind = "copy"
selector = "#copy-nodes"
feedback_selector = "#copy-nodes-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "download-yaml"
kind = "download"
selector = "#download-yaml"
feedback_selector = "#download-yaml-status"
success_text = "Download started"
failure_text = "Download failed"
failure_url_pattern = "**/pipelines/*.yaml"

[[browser.controls]]
id = "download-fixture"
kind = "download"
selector = "#download-fixture"
feedback_selector = "#download-fixture-status"
success_text = "Download started"
failure_text = "Download failed"
failure_url_pattern = "**/fixtures/stages/**"

[[services]]
id = "gateway"
command = ["python3", "gateway/fixture_gateway.py"]
ready_url = "http://127.0.0.1:18157/status"
stop_command = ["python3", "scripts/stop_local.py", "18157"]

[[pipelines]]
id = "gateway-http"
path = "pipelines/gateway-http.yaml"
input = "data/events.jsonl"
expected = "expected/gateway-http.jsonl"
timeout_seconds = 60

[[pipelines]]
id = "gateway-subprocess"
path = "pipelines/gateway-subprocess.yaml"
input = "data/events.jsonl"
expected = "expected/gateway-subprocess.jsonl"
timeout_seconds = 60

[[stages]]
id = "gateway-http-read"
pipeline = "gateway-http"
selector = "[data-stage='gateway-http.read']"
input = "fixtures/stages/gateway-http/01-read.input.jsonl"
output = "fixtures/stages/gateway-http/01-read.output.jsonl"

[[stages]]
id = "gateway-http-parse"
pipeline = "gateway-http"
selector = "[data-stage='gateway-http.parse']"
input = "fixtures/stages/gateway-http/02-parse.input.jsonl"
output = "fixtures/stages/gateway-http/02-parse.output.jsonl"

[[stages]]
id = "gateway-http-request"
pipeline = "gateway-http"
selector = "[data-stage='gateway-http.request']"
input = "fixtures/stages/gateway-http/03-request.input.jsonl"
