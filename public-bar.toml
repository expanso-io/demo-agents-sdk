pipeline = "gateway-http"
selector = "[data-stage='gateway-http.output']"
input = "fixtures/stages/gateway-http/08-output.input.jsonl"
output = "fixtures/stages/gateway-http/08-output.output.jsonl"

[[stages]]
id = "gateway-subprocess-read"
pipeline = "gateway-subprocess"
selector = "[data-stage='gateway-subprocess.read']"
input = "fixtures/stages/gateway-subprocess/01-read.input.jsonl"
output = "fixtures/stages/gateway-subprocess/01-read.output.jsonl"

[[stages]]
id = "gateway-subprocess-request"
pipeline = "gateway-subprocess"
selector = "[data-stage='gateway-subprocess.request']"
input = "fixtures/stages/gateway-subprocess/02-request.input.jsonl"
output = "fixtures/stages/gateway-subprocess/02-request.output.jsonl"

[[stages]]
id = "gateway-subprocess-reply"
pipeline = "gateway-subprocess"
