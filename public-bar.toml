output = "fixtures/stages/gateway-subprocess/06-output.output.jsonl"

[[platforms]]
name = "docker-compose"
profile = "compose"
tls = true
auth = true
persistent = true
files = ["docker-compose.yaml", "deploy/docker-compose.node.yaml"]
validators = [
  ["docker", "compose", "-f", "docker-compose.yaml", "config", "--quiet"],
  ["docker", "compose", "-f", "deploy/docker-compose.node.yaml", "config", "--quiet"],
]

[[yaml]]
path = "config/edge-local.yaml"
role = "support"

[[yaml]]
path = "config/edge-node.yaml"
role = "support"

[regressions]
features = "public-features.json"
removal_files = ["public-removals/*.json"]
