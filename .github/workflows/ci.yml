name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast:
    name: lint + unit + structure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint (ruff check)
        run: uv run --group dev ruff check gateway/ scripts/ tests/

      - name: Format check (ruff format --check)
        run: uv run --group dev ruff format --check gateway/ scripts/ tests/

      - name: Unit + structure tests
        run: uv run --group dev pytest -m "not smoke"

      - name: Explorer page matches its contract
        run: uv run -s scripts/build_explorer.py --check

      - name: Docker Compose config validates
        run: |
          docker compose config --quiet
          docker compose -f deploy/docker-compose.node.yaml config --quiet

  smoke:
    name: both pipelines in Docker against expected output
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run both pipelines
        run: uv run --group dev pytest -m smoke -v

  prove:
    name: proof run, explorer data and node stack
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run, compare, rebuild fixtures, prove the node stack
        env:
          PROVE_REQUIRE_DOCKER: "1"
        run: uv run -s scripts/prove.py --check --node

      - name: Keep the dated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: reports/
