# Root pyproject is for tests only — the classifier scripts in scripts/
# carry their own PEP 723 inline deps and do not depend on this file.
[project]
name = "demo-agents-sdk-tests"
version = "0.0.0"
description = "Test harness for demo-agents-sdk pipelines and classifier scripts."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: end-to-end pipeline test that requires Docker (slow)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = [".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
