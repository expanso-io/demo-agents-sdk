# =============================================================================
# OpenAI — HTTP-direct: pipeline calls api.openai.com from inside Expanso Edge.
# Validate: expanso-cli job validate --offline pipelines/openai-http.yaml
# =============================================================================
---
name: openai-http
type: pipeline
config:
  input:
    file:
      paths: [/data/events.jsonl]
      codec: lines

  pipeline:
    processors:
      # Each line arrives as a JSON string; parse it.
      - mapping: |
          root = content().parse_json()

      # Branch out: call OpenAI, merge category/sentiment/priority back in.
      - branch:
          request_map: |
            root.model = "${OPENAI_MODEL:-gpt-4o-mini}"
            root.response_format = {"type": "json_object"}
            root.messages = [
              {
                "role": "system",
                "content": "Classify support tickets. Respond with strict JSON: {\"category\":\"billing|technical|account|other\",\"sentiment\":\"pos|neg|neu\",\"priority\":\"low|med|high\"}"
              },
              {"role": "user", "content": this.message}
            ]
          processors:
            - http:
                url: https://api.openai.com/v1/chat/completions
                verb: POST
                headers:
                  Content-Type: application/json
                  Authorization: Bearer ${OPENAI_API_KEY}
                retries: 2
          result_map: |
            let parsed = this.choices.0.message.content.parse_json()
            root.category = parsed.category
            root.sentiment = parsed.sentiment
            root.priority = parsed.priority
            root._provider = "openai"
            root._mode = "http"

  output:
    stdout:
      codec: lines
