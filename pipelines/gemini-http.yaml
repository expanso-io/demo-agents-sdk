# =============================================================================
# Gemini — HTTP-direct: pipeline calls generativelanguage.googleapis.com.
# Validate: expanso-cli job validate --offline pipelines/gemini-http.yaml
# =============================================================================
---
name: gemini-http
type: pipeline
config:
  input:
    file:
      paths: [/data/events.jsonl]
      codec: lines

  pipeline:
    processors:
      - mapping: |
          root = content().parse_json()

      - branch:
          request_map: |
            root.contents = [
              {"role": "user", "parts": [{"text": this.message}]}
            ]
            root.system_instruction = {
              "parts": [{"text": "Classify support tickets. Respond with strict JSON: {\"category\":\"billing|technical|account|other\",\"sentiment\":\"pos|neg|neu\",\"priority\":\"low|med|high\"}"}]
            }
            root.generationConfig = {"response_mime_type": "application/json"}
          processors:
            - http:
                url: https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL:-gemini-2.0-flash}:generateContent
                verb: POST
                headers:
                  Content-Type: application/json
                  x-goog-api-key: ${GEMINI_API_KEY}
                retries: 2
          result_map: |
            let parsed = this.candidates.0.content.parts.0.text.parse_json()
            root.category = parsed.category
            root.sentiment = parsed.sentiment
            root.priority = parsed.priority
            root._provider = "gemini"
            root._mode = "http"

  output:
    stdout:
      codec: lines
