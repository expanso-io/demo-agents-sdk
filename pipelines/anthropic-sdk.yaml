# =============================================================================
# Anthropic — SDK via subprocess: pipeline runs `uv run -s anthropic_classify.py`
# as a long-lived child process. The script imports `anthropic` once and loops
# on stdin per message.
# Validate: expanso-cli job validate --offline pipelines/anthropic-sdk.yaml
# =============================================================================
---
name: anthropic-sdk
type: pipeline
config:
  input:
    file:
      paths: [/data/events.jsonl]
      codec: lines

  pipeline:
    processors:
      - subprocess:
          name: uv
          args: ["run", "-s", "/scripts/anthropic_classify.py"]

  output:
    stdout:
      codec: lines
