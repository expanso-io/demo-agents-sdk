# =============================================================================
# OpenAI — SDK via subprocess: pipeline runs `uv run -s openai_classify.py`
# as a long-lived child process. The script imports `openai` once at startup,
# then loops on stdin per message. SDK retries, structured output, and any
# future SDK features come for free without leaving the pipeline.
# Validate: expanso-cli job validate --offline pipelines/openai-sdk.yaml
# =============================================================================
---
name: openai-sdk
type: pipeline
config:
  input:
    file:
      paths: [/data/events.jsonl]
      codec: lines

  pipeline:
    processors:
      - subprocess:
          name: uv
          args: ["run", "-s", "/scripts/openai_classify.py"]

  output:
    stdout:
      codec: lines
