# =============================================================================
# Gemini — SDK via subprocess: pipeline runs `uv run -s gemini_classify.py`
# as a long-lived child process. The script uses `google-genai`'s
# response_schema for typed structured output.
# Validate: expanso-cli job validate --offline pipelines/gemini-sdk.yaml
# =============================================================================
---
name: gemini-sdk
type: pipeline
config:
  input:
    file:
      paths: [/data/events.jsonl]
      codec: lines

  pipeline:
    processors:
      - subprocess:
          name: uv
          args: ["run", "-s", "/scripts/gemini_classify.py"]

  output:
    stdout:
      codec: lines
